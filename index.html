<!doctype html>
<html lang="en">
  <head>
    <title>My First Website</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->

    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>

    <div class="container-fluid text-center">
      <h1><span class="border border-primary border-4">Hello World</span></h1>
      <p>This is the main paragraph that will be for my website</p>
    </div>

    <img
      src="images/bootstraplogo2.png"
      class="img-fluid"
      alt="This picture is of a bootstrap logo that is of a different angle"
    />
    <br />

    <a
      href="https://tv.apple.com/us/show/mr-robot/umc.cmc.306sepo05euzg2r68zzsa02up"
      target="_blank"
      rel="noopener noreferrer"
      >Watch Mr.Robot on Apple TV
    </a>

    <br />

    <img
      src="images/bootstrap.png"
      class="img-fluid"
      alt="The picture is of the bootstrap logo"
    />
  </body>
</html>
